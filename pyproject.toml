[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koml-prioritisation-engine"
version = "0.1.0"
description = "Deterministic priorities from explicit task estimates"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
kpe = "koml_prioritisation_engine.cli:main"

[tool.setuptools.packages.find]
include = ["koml_prioritisation_engine*"]
